name: eyzo
description: "Eyzo - contrôle des lunettes connectées ESP32"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # BLE
  flutter_blue_plus: ^1.35.3
  permission_handler: ^11.4.0

  # State management
  flutter_riverpod: ^2.6.1

  # Persistance locale
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Traitement image
  image: ^4.5.4
  image_picker: ^1.1.2

  # Divers
  uuid: ^4.5.1
  intl: ^0.20.2
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/panda_icon.png"
  min_sdk_android: 26
